<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isometric Melbourne experiment</title>
<style>
  :root { --ink: #23252e; --paper: #f3ecd8; --water: #4884b0; --accent: #c86a48; --ok: #3f7d4e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; max-width: 76ch; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 12px; opacity: 0.75; }
  .options { display: grid; gap: 14px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
  .option { border: 2px solid var(--ink); background: #fffaf0; box-shadow: 4px 4px 0 var(--ink); display: flex; flex-direction: column; }
  .option.chosen { outline: 4px solid var(--ok); outline-offset: 2px; }
  .option h2 { margin: 0; padding: 6px 10px; font-size: 15px; background: var(--ink); color: var(--paper); }
  .view { height: min(46vh, 420px); background: var(--water); position: relative; }
  .option table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .option th, .option td { text-align: left; padding: 5px 10px; border-top: 1px solid rgba(35,37,46,0.25); vertical-align: top; }
  .option th { width: 46%; font-weight: 400; opacity: 0.75; }
  .option td { font-weight: 700; }
  .rating { padding: 8px 10px; border-top: 1px solid rgba(35,37,46,0.25); font-size: 13px; }
  .rating .scale { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .rating label { border: 2px solid var(--ink); padding: 2px 8px; cursor: pointer; background: #fff; }
  .rating input { position: absolute; opacity: 0; }
  .rating input:checked + span { background: var(--ink); color: var(--paper); box-shadow: 0 0 0 4px var(--ink); }
  .rating input:focus-visible + span { outline: 3px solid var(--accent); }
  .rating .ends { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.7; margin-top: 2px; }
  button { font: inherit; font-weight: 700; color: var(--paper); background: var(--ink); border: 2px solid var(--ink);
    padding: 8px 16px; cursor: pointer; }
  button.choose { margin: 10px; background: #fffaf0; color: var(--ink); }
  .chosen button.choose { background: var(--ok); border-color: var(--ok); color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .next { display: flex; justify-content: flex-end; margin-top: 16px; }
  input[type=text] { font: inherit; padding: 7px 8px; border: 2px solid var(--ink); background: #fff; width: 260px; }
  .marker { pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  .marker .tag { background: var(--paper); border: 2px solid var(--ink); padding: 1px 6px; font: 700 12px/1.3 ui-monospace, Menlo, monospace;
    white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); }
  .marker .stem { width: 2px; height: 18px; background: var(--ink); }
  .marker .dot { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; margin-top: -2px; }
  code { background: #fff; border: 2px solid var(--ink); padding: 4px 10px; font-size: 18px; }
  .error { color: #a02c1c; font-weight: 700; }
  @media (max-width: 760px) { .options { grid-template-columns: 1fr; } .view { height: 38vh; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p>Loading…</p></main>
<script src="vendor/openseadragon.min.js"></script>
<script src="experiment.js"></script>
</body>
</html>
